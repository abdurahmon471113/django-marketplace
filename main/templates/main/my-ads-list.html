{% extends 'base.html' %}
{% load humanize %}

{% block title %}Объявления{% endblock %}

{% block content %}

<h1 class="fw-bold mb-4">
    Объявления пользователя {{ user.username }}
</h1>



<div class="mb-4">

    <a
        href="{% url 'main:my_ads_list_ajax' %}?status=active"
        class="status-link p-3 text-decoration-none
        {% if current_status == 'active' %}
            fw-bold text-dark border-bottom border-3 border-dark
        {% endif %}"
    >
        Активные
    </a>

    <a
        href="{% url 'main:my_ads_list_ajax' %}?status=waiting"
        class="status-link p-3 text-decoration-none
        {% if current_status == 'waiting' %}
            fw-bold text-dark border-bottom border-3 border-dark
        {% endif %}"
    >
        Ожидающие
    </a>

    <a
        href="{% url 'main:my_ads_list_ajax' %}?status=archived"
        class="status-link p-3 text-decoration-none
        {% if current_status == 'archived' %}
            fw-bold text-dark border-bottom border-3 border-dark
        {% endif %}"
    >
        Архив
    </a>

    <a
        href="{% url 'main:my_ads_list_ajax' %}?status=rejected"
        class="status-link p-3 text-decoration-none
        {% if current_status == 'rejected' %}
            fw-bold text-dark border-bottom border-3 border-dark
        {% endif %}"
    >
        Отклонённые
    </a>

</div>

<div class="ads-container">
    {% include 'main/partials/my_ads_cards.html' %}
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {

    const overallStatuses = document.querySelectorAll('.status-link');
    const adsContainer = document.querySelector('.ads-container');

    overallStatuses.forEach(function (status) {

        status.addEventListener('click', function (event) {

            event.preventDefault();

            const clickedStatus = this;
            const eachStatus = this.getAttribute('href');


            fetch(eachStatus)
                .then(function (response) {
                    return response.json();
                })
                .then(function (data) {

                    adsContainer.innerHTML = data.html;

                    overallStatuses.forEach(function (status) {
                        status.classList.remove(
                            'fw-bold',
                            'text-dark',
                            'border-bottom',
                            'border-3',
                            'border-dark'
                        );
                    });

                    clickedStatus.classList.add(
                        'fw-bold',
                        'text-dark',
                        'border-bottom',
                        'border-3',
                        'border-dark'
                    );
                })
                .catch(function (error) {
                    console.error('Ошибка AJAX:', error);
                });
        });
    });
});
</script>

{% endblock %}
